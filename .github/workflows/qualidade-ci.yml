name: Quality Security Gates

# [QA-005] Gates transversais do repositório: secrets, revisão de dependências e isolamento do PR de demonstração.
# Sem filtro de paths de propósito: o check precisa existir em todo PR para poder ser marcado como obrigatório (branch protection).

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop, feature/* ]

permissions:
  contents: read

concurrency:
  group: quality-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-config-check:
    runs-on: ubuntu-latest
    steps:
      - name: Report security jobs that will be skipped
        env:
          DEPREV: ${{ vars.DEPENDENCY_REVIEW_ENABLED }}
        run: |
          if [ "$DEPREV" != "true" ]; then
            echo "::warning::DEPENDENCY_REVIEW_ENABLED não é true: o job dependency-review foi IGNORADO."
            echo "- Dependency Review: ignorado (defina a variável DEPENDENCY_REVIEW_ENABLED=true)" >> "$GITHUB_STEP_SUMMARY"
          fi

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          GL_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  dependency-review:
    if: ${{ github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Dependency Review (todas as alterações de manifesto)
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Semgrep CE
        run: pip install "semgrep>=1.90,<2"

      - name: Run Semgrep CE
        run: |
          semgrep scan --config p/default --config p/javascript --config p/secrets \
            --metrics=off --json-output=semgrep.json --text . || true

      - name: Summarize findings (severity, file, reason, fix path)
        if: always()
        run: |
          {
            echo "### Semgrep CE (SAST) – raiz"
            echo ""
            echo "| Gravidade | Arquivo:linha | Motivo | Caminho de correção |"
            echo "|---|---|---|---|"
            jq -r '.results[] | "| \(.extra.severity) | \(.path):\(.start.line) | \(.extra.message | gsub("[\n|]";" ")) | \(.extra.fix // .extra.metadata.references[0] // .check_id) |"' semgrep.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Block merge on ERROR findings
        run: |
          n=$(jq '[.results[] | select(.extra.severity=="ERROR")] | length' semgrep.json)
          echo "Findings ERROR: $n"
          [ "$n" -eq 0 ]

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-report
          path: semgrep.json

  # Garante que o código vulnerável de demonstração nunca chegue à main/dev (só existe na branch do PR de demonstração).
  demo-isolation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fail if demo vulnerabilities exist on protected branches
        if: ${{ github.event_name == 'push' }}
        run: |
          if [ -d security-demo ]; then
            echo "::error::security-demo/ não pode existir em main/dev"
            exit 1
          fi